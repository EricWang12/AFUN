defaults:
  - paths
  - model/decoder@decoder: sam3_decoder
  - model/llm@llm: qwen3_vl_8B
  - model/decoder/loss@decoder.loss: sam3_loss
  - data: multi_source
  - train: trainer
  - _self_

stage: 2
seed: 354
model_name: afun-stage2
rms_norm: false

train:
  batch_size: 32
  ckpt_path: checkpoints/afun_stage1.pt
  training_cfg:
    max_steps: 40000

hydra:
  run:
    dir: ${paths.output}/${model_name}/${now:%Y-%m-%d_%H-%M-%S}
